; Project PHP overrides picked up by the Railpack PHP build.
; Raises the file upload limit to 50MB per file (55MB total POST body to
; leave headroom for multipart overhead and additional form fields).
upload_max_filesize = 50M
post_max_size = 55M

; Parts accepted in a single multipart request. The task file API caps itself
; at 10 (storage.api_max_files), so this only bites if that config is raised —
; and PHP drops the extra parts silently rather than erroring, so the ceiling is
; pinned here instead of left to the platform default.
max_file_uploads = 20
